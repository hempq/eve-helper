# Always-on EVE Helper stack, fully independent of DDEV.
# Start:  docker compose -f deploy/docker-compose.yml up -d --build
# The web app is served on http://localhost:8899
#
# ddev poweroff does NOT affect these containers (separate compose project
# "eve-helper", separate network, own host port). SQLite keeps it to a single
# service group with no database container.
name: eve-helper

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: eve-helper-app:local
  restart: unless-stopped
  volumes:
    - ..:/app
    # Prod env (SQLite) shadows the dev .env (MariaDB); its own bootstrap
    # cache keeps dev's config cache from bleeding in.
    - ./.env.production:/app/.env:ro
    - prod-cache:/app/bootstrap/cache

services:
  app:
    <<: *app
    command: >
      sh -c "touch /app/database/database.sqlite &&
             php artisan optimize:clear &&
             php artisan migrate --force &&
             php artisan serve --host=0.0.0.0 --port=8000"
    # No host port: Caddy is the entrypoint and reaches the app in-network.
    expose:
      - "8000"

  # HTTPS entrypoint with the mkcert cert Windows already trusts (DDEV's CA).
  # Port 8443 because DDEV's router holds 127.0.0.1:443.
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    ports:
      - "8443:8443"

  scheduler:
    <<: *app
    command: php artisan schedule:work --no-interaction
    depends_on: [app]

  queue:
    <<: *app
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600 --no-interaction
    depends_on: [app]

volumes:
  prod-cache:
